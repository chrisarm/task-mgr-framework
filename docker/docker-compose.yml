name: task-mgr-recall

services:
  # --- GPU variants (default — no --profile flag required) ---

  ollama:
    build:
      context: ./ollama
      additional_contexts:
        # Host-specific CA certs (e.g. Cloudflare WARP gateway) installed into
        # the image trust store before build-time downloads. See certs/README.md.
        certs: ./certs
      args:
        # Override via scripts/recall-stack-up.sh --embed-profile or:
        #   docker compose build --build-arg OLLAMA_MODEL=...
        OLLAMA_MODEL: ${OLLAMA_MODEL:-hf.co/jinaai/jina-embeddings-v5-text-small-retrieval-GGUF:Q8_0}
    ports:
      - "11435:11434"
    restart: unless-stopped
    healthcheck:
      # /api/tags lists installed models — cheap, 200 even on empty install.
      # ollama/ollama base image (Ubuntu) ships curl.
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      # Nemotron 8B can take longer than Jina to become healthy on first boot;
      # 120s covers both default and larger embed profiles.
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  llama-box:
    build:
      context: ./llama-box
      additional_contexts:
        certs: ./certs
      args:
        LLAMA_BOX_VARIANT: cuda-12.8
        HF_REPO: ${RERANK_HF_REPO:-gpustack/jina-reranker-v2-base-multilingual-GGUF}
        HF_FILE: ${RERANK_HF_FILE:-jina-reranker-v2-base-multilingual-FP16.gguf}
        HF_REVISION: ${RERANK_HF_REVISION:-09a0e5b9f3d193a4f1e771ba6ceccdf1153d3a9a}
        MODEL_PATH: ${RERANK_MODEL_PATH:-/models/jina-reranker-v2.gguf}
    ports:
      # Host 8181 (project default — avoids clashing with other projects
      # that commonly publish on 8080); container internal stays at 8080.
      - "8181:8080"
    restart: unless-stopped
    healthcheck:
      # Try /health, fall back to /v1/models (OpenAI-compat, 200 when model loaded),
      # then TCP probe via nc. llama-box base image ships wget (used in Dockerfile RUN);
      # curl may not be present — prefer wget for HTTP probes.
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:8080/health 2>/dev/null || wget -qO /dev/null http://localhost:8080/v1/models 2>/dev/null || nc -z localhost 8080 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # --- CPU-only variants (opt-in via --profile cpu) ---

  ollama-cpu:
    profiles: [cpu]
    build:
      context: ./ollama
      additional_contexts:
        certs: ./certs
      args:
        OLLAMA_MODEL: ${OLLAMA_MODEL:-hf.co/jinaai/jina-embeddings-v5-text-small-retrieval-GGUF:Q8_0}
    ports:
      - "11435:11434"
    restart: unless-stopped
    healthcheck:
      # Same probe as GPU variant; start_period covers model load on CPU.
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  llama-box-cpu:
    profiles: [cpu]
    build:
      context: ./llama-box
      additional_contexts:
        certs: ./certs
      args:
        HF_REPO: ${RERANK_HF_REPO:-gpustack/jina-reranker-v2-base-multilingual-GGUF}
        HF_FILE: ${RERANK_HF_FILE:-jina-reranker-v2-base-multilingual-FP16.gguf}
        HF_REVISION: ${RERANK_HF_REVISION:-09a0e5b9f3d193a4f1e771ba6ceccdf1153d3a9a}
        MODEL_PATH: ${RERANK_MODEL_PATH:-/models/jina-reranker-v2.gguf}
    ports:
      # Host 8181 (see GPU variant above for rationale).
      - "8181:8080"
    restart: unless-stopped
    healthcheck:
      # Same probe as GPU variant; wget preferred (confirmed available in base image).
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:8080/health 2>/dev/null || wget -qO /dev/null http://localhost:8080/v1/models 2>/dev/null || nc -z localhost 8080 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
